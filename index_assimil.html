<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f6b5b" />
    <title>Assimil English · Daily Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Assimil English 首页"><span class="brand-mark">A</span><span>Assimil English</span></a>
        <button id="statsButton" class="text-button" type="button">学习记录</button>
      </header>

      <section id="homeScreen" class="screen active" aria-labelledby="homeTitle">
        <div class="hero-card">
          <p class="eyebrow" id="dayLabel">DAY 1</p>
          <h1 id="homeTitle">今天，用英语自然地说出来。</h1>
          <p id="lessonMeta" class="muted">加载课程中…</p>
          <div class="progress-summary"><div><strong id="streakValue">0</strong><span>连续天数</span></div><div><strong id="completedValue">0</strong><span>完成课程</span></div><div><strong id="reviewValue">—</strong><span>复习表现</span></div></div>
          <button id="startButton" class="primary-button" type="button">开始今天的学习 <span>→</span></button>
          <button id="nextPracticeButton" class="secondary-button" type="button">🎲 下一个练习</button>
          <button id="resetTodayButton" class="quiet-button" type="button">重新开始本课</button>
        </div>

        <section class="lesson-library" aria-labelledby="libraryTitle"><p class="eyebrow">PRACTICE LIBRARY</p><h2 id="libraryTitle">30 篇日常英语练习</h2><p class="muted">选择一个标题，马上开始这一篇。</p><div id="lessonList" class="lesson-list"></div></section>
      </section>

      <section id="lessonScreen" class="screen" aria-live="polite">
        <div class="lesson-top"><button id="backHomeButton" class="icon-button" type="button" aria-label="返回首页">←</button><div><p class="eyebrow" id="stepKicker">STEP 1 OF 6</p><h2 id="stepTitle">先听一听</h2></div><div class="mini-progress" aria-label="课程进度"><span id="miniProgressFill"></span></div></div>
        <div id="stepDots" class="step-dots" aria-label="学习步骤"></div>
        <article class="lesson-card">
          <p id="stepInstruction" class="instruction"></p>
          <div id="lessonContent"></div>
          <div class="lesson-actions"><button id="previousButton" class="secondary-button" type="button">上一步</button><button id="nextButton" class="primary-button" type="button">继续 <span>→</span></button></div>
        </article>
      </section>

      <section id="completeScreen" class="screen" aria-labelledby="completeTitle">
        <div class="complete-card"><div class="celebration">✓</div><p class="eyebrow">TODAY COMPLETE</p><h1 id="completeTitle">完成得很好。</h1><p>你已经完成今天的输入、模仿和回忆。明天再来一点，英语会慢慢变成你的直觉。</p><div id="completeStats" class="completion-stats"></div><button id="homeFromCompleteButton" class="primary-button" type="button">回到首页</button><button id="nextPracticeFromCompleteButton" class="secondary-button" type="button">🎲 下一个练习</button></div>
      </section>

      <dialog id="statsDialog"><div class="dialog-head"><h2>学习记录</h2><button id="closeStatsButton" class="icon-button" type="button" aria-label="关闭">×</button></div><div id="statsContent"></div><button id="clearProgressButton" class="danger-button" type="button">清除所有本地记录</button></dialog>
    </main>
    <template id="speakerTemplate"><button class="speaker-button" type="button" aria-label="播放英文">🔊</button></template>
    <script src="storage.js"></script>
    <script src="lessons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
