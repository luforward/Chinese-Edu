<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中文生词整理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro/dist/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
body{background:#f5f6fa;padding:40px}.container{max-width:1000px}
table input{border:none;width:100%;background:transparent}table input:focus{outline:none}
th{text-align:center}td{vertical-align:middle}
</style></head><body>
<div class="container">
<h2 class="mb-4">中文生词整理</h2>
<table class="table table-bordered" id="vocabTable">
<thead class="table-success"><tr><th>生词</th><th>拼音</th><th>英文</th><th>操作</th></tr></thead>
<tbody></tbody></table>
<div class="mt-3">
<button class="btn btn-success me-2" onclick="exportExcel()">导出Excel</button>
<button class="btn btn-danger" onclick="clearAll()">清空所有生词</button>
</div></div>
<script>
const tbody=document.querySelector("#vocabTable tbody");
function saveData(){let d=[];tbody.querySelectorAll("tr").forEach(r=>{let a=[0,1,2].map(i=>r.cells[i].querySelector("input").value.trim());if(a.join(""))d.push(a)});localStorage.setItem("vocabData",JSON.stringify(d))}
function addRow(w="",p="",e=""){
 let tr=document.createElement("tr");
 tr.innerHTML=`<td><input value="${w}"></td><td><input value="${p}"></td><td><input value="${e}"></td><td><button class="btn btn-sm btn-outline-danger">🗑</button></td>`;
 tbody.appendChild(tr);
 let wi=tr.cells[0].querySelector("input"),pi=tr.cells[1].querySelector("input"),ei=tr.cells[2].querySelector("input");
 wi.onblur=()=>updateRow(tr);
 wi.oninput=()=>{saveData();checkLastRow();}
 pi.oninput=saveData;ei.oninput=saveData;
 tr.querySelector("button").onclick=()=>{if(confirm("确定删除这一行？")){tr.remove();if(!tbody.rows.length)addRow();saveData();}}
}
function loadData(){let d=JSON.parse(localStorage.getItem("vocabData")||"[]");if(!d.length)addRow();else d.forEach(x=>addRow(...x))}
async function updateRow(tr){
 let w=tr.cells[0].querySelector("input").value.trim(); if(!w){saveData();return;}
 tr.cells[1].querySelector("input").value=pinyinPro.pinyin(w,{toneType:"symbol"});
 try{
 let u=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=${encodeURIComponent(w)}`;
 let j=await (await fetch(u)).json();
 tr.cells[2].querySelector("input").value=j[0].map(i=>i[0]).join("");
 }catch{tr.cells[2].querySelector("input").value="Translation Error";}
 saveData();checkLastRow();
}
function checkLastRow(){let r=tbody.lastElementChild;if(r&&r.cells[0].querySelector("input").value.trim()!="")addRow();}
function clearAll(){if(confirm("确定清空所有生词吗？")){tbody.innerHTML="";localStorage.removeItem("vocabData");addRow();}}
function exportExcel(){
 let data=[["生词","拼音","英文"]];
 tbody.querySelectorAll("tr").forEach(r=>{let w=r.cells[0].querySelector("input").value.trim();if(w)data.push([0,1,2].map(i=>r.cells[i].querySelector("input").value));});
 let ws=XLSX.utils.aoa_to_sheet(data),wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,"Vocabulary");
 XLSX.writeFile(wb,(data[1]?.[0]||"Vocabulary")+".xlsx");
}
loadData();
</script></body></html>
