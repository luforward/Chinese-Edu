<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>中文生词整理</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<script src="https://cdn.jsdelivr.net/npm/pinyin-pro/dist/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
    background:#f5f6fa;
    padding:40px;
}

.container{
    max-width:1000px;
}

table input{
    border:none;
    width:100%;
    background:transparent;
}

table input:focus{
    outline:none;
}

th{
    text-align:center;
}

td{
    vertical-align:middle;
}

button{
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h2 class="mb-4">
中文生词整理
</h2>

<table class="table table-bordered align-middle" id="vocabTable">

<thead class="table-success">

<tr>

<th width="35%">
生词
</th>

<th width="30%">
拼音
</th>

<th width="35%">
英文
</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

<button class="btn btn-success" onclick="exportExcel()">
导出 Excel
</button>

</div>

<script>

const tbody=document.querySelector("#vocabTable tbody");

function saveData(){

let data=[];

tbody.querySelectorAll("tr").forEach(row=>{

const word=row.cells[0].querySelector("input").value;

const py=row.cells[1].querySelector("input").value;

const en=row.cells[2].querySelector("input").value;

data.push([word,py,en]);

});

localStorage.setItem("vocabData",JSON.stringify(data));

}

function loadData(){

const data=JSON.parse(localStorage.getItem("vocabData")||"[]");

if(data.length==0){

addRow();

return;

}

data.forEach(d=>{

addRow(d[0],d[1],d[2]);

});

}

function addRow(word="",py="",en=""){

const tr=document.createElement("tr");

tr.innerHTML=`

<td>
<input value="${word}">
</td>

<td>
<input value="${py}" readonly>
</td>

<td>
<input value="${en}" readonly>
</td>

`;

tbody.appendChild(tr);

const wordInput=tr.cells[0].querySelector("input");

wordInput.addEventListener("blur",()=>{

updateRow(tr);

});

wordInput.addEventListener("input",saveData);

}

async function updateRow(tr){

const word=tr.cells[0].querySelector("input").value.trim();

if(word==""){

saveData();

return;

}

const py=pinyinPro.pinyin(word,{toneType:"symbol"});

tr.cells[1].querySelector("input").value=py;

try{

const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=${encodeURIComponent(word)}`;

const res=await fetch(url);

const data=await res.json();

const en=data[0].map(i=>i[0]).join("");

tr.cells[2].querySelector("input").value=en;

}catch(e){

tr.cells[2].querySelector("input").value="Translation Error";

}

saveData();

checkLastRow();

}

function checkLastRow(){

const rows=tbody.querySelectorAll("tr");

const last=rows[rows.length-1];

const word=last.cells[0].querySelector("input").value.trim();

if(word!=""){

addRow();

}

}

function exportExcel(){

let data=[["生词","拼音","英文"]];

tbody.querySelectorAll("tr").forEach(row=>{

const word=row.cells[0].querySelector("input").value.trim();

if(word=="") return;

const py=row.cells[1].querySelector("input").value;

const en=row.cells[2].querySelector("input").value;

data.push([word,py,en]);

});

const ws=XLSX.utils.aoa_to_sheet(data);

const wb=XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb,ws,"Vocabulary");

const filename=data.length>1?data[1][0]+".xlsx":"Vocabulary.xlsx";

XLSX.writeFile(wb,filename);

}

loadData();

</script>

</body>

</html>
